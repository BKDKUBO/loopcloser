name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: firestore-tests/package-lock.json }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements*.txt }
      - run: npm install -g firebase-tools
      - run: cd firestore-tests && npm ci
      - run: cd api && python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Security rules + Firestore repository tests (emulator)
        run: >
          firebase emulators:exec --only firestore --project demo-loopcloser
          "cd firestore-tests && npm test && cd ../api && .venv/bin/python -m pytest -m emulator"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: LoopCloser never targets the InvoiceSentinel project
        run: |
          if git grep -n "gen-lang-client-0252871691" -- . ':!deploy/project.env' ':!.github/workflows/ci.yml'; then
            echo "Found the InvoiceSentinel project id. LoopCloser must use its own project (deploy/project.env)."; exit 1
          fi
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact -v
